name: Verify official item tooltip API
on:
  push:
    paths: ['.github/workflows/wiki-tip-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect original API response structures
        run: |
          python3 - <<'PY'
          import requests,json
          for id in [50301,290,3219,100138,8003]:
            url=f'https://wiki.verzum.to/api/wiki/tip/{id}?lang=it'
            try:
              r=requests.get(url,timeout=12,headers={'X-Requested-With':'verzum','Accept':'application/json'})
              print(id,'HTTP',r.status_code,'TYPE',r.headers.get('content-type'), 'LENGTH',len(r.content))
              print(r.text[:3000])
            except Exception as e:print(id,'ERROR',repr(e))
          PY
