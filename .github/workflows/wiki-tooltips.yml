name: Mirror original VERZUM item tooltip API
on:
  push:
    paths: ['.github/workflows/wiki-tooltips.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-original-tooltips:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read original Italian item bonuses and PNG icons
        run: node scripts/mirror-wiki-tooltips.mjs
      - name: Save genuine item data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wiki-item-tooltips.generated.js public/wiki-item-tooltip-report.json public/wiki-original/items
          if ! git diff --cached --quiet; then
            git commit -m "Mirror original Italian VERZUM item bonuses and icons from official tooltip API"
            git push origin HEAD:${{ github.ref_name }}
          fi
