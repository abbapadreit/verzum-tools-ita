name: Inspect Wiki scripts for original model and hover behavior
on:
  push:
    paths: ['.github/workflows/wiki-js-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect look, wiki and followtip scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,re
          base='https://wiki.verzum.to/assets/5258621bfec0/js/'
          for name in ['wiki.js','look.js','followtip.js','turntable.js','items.js']:
              r=requests.get(base+name,timeout=15)
              s=r.text
              print('\n===',name,r.status_code,'LENGTH',len(s),'===')
              print('HEAD',s[:1000].replace('\n',' '))
              for pat in [r'(?:^|\n)import[^\n]{1,180}',r'fetch\([^\n]{1,140}',r'\b/[a-z-]+/(?:\$\{[^}]+\}|[a-z0-9_/-]+)',r'data-model[^\n]{1,130}',r'(?:gltf|glb|\.json|\.png|\.webp)[^\n]{0,70}']:
                  xs=re.findall(pat,s,re.I)
                  print('MATCH',pat,'::',[x[:170] for x in xs[:13]])
          PY
