name: Inspect original 3D viewer configuration
on:
  push:
    paths: ['.github/workflows/wiki-model-config-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Discover original viewer endpoint and frames
        run: |
          python3 - <<'PY'
          import requests,re
          page=requests.get('https://wiki.verzum.to/it/metins/metin_low',timeout=15).text
          for pattern in [r'<[a-z]+[^>]*data-wiki[^>]*>',r'data-viewer\s*=\s*["\'][^"\']+',r'data-msg-failed\s*=\s*["\'][^"\']+']:
            print('MATCH',pattern,[m[:900] for m in re.findall(pattern,page,re.I)[:3]])
          for path in ['wiki-model.js','turntable.js']:
            r=requests.get('https://wiki.verzum.to/assets/5258621bfec0/js/'+path,timeout=15)
            print('MODULE',path,'size',len(r.content))
            if path=='turntable.js':print('END',r.text[-1800:])
          PY
